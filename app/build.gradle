plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.smarthub'
    compileSdk 35
    
    signingConfigs {
        release {
            // TODO: Configure release signing for production
            // storeFile file('release.keystore')
            // storePassword System.getenv('KEYSTORE_PASSWORD')
            // keyAlias System.getenv('KEY_ALIAS')
            // keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId "com.example.smarthub"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    
        buildTypes {
        debug {
            buildConfigField "String", "WEATHER_API_KEY", "\"YOUR_WEATHER_API_KEY_HERE\""
            buildConfigField "String", "MANDI_API_KEY", "\"YOUR_MANDI_API_KEY_HERE\""
            buildConfigField "String", "AGRI_API_BASE_URL", "\"https://agritech-production-23f3.up.railway.app/\""
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "WEATHER_API_KEY", "\"YOUR_WEATHER_API_KEY_HERE\""
            buildConfigField "String", "MANDI_API_KEY", "\"YOUR_MANDI_API_KEY_HERE\""
            buildConfigField "String", "AGRI_API_BASE_URL", "\"https://agritech-production-23f3.up.railway.app/\""
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.swiperefreshlayout

    // Retrofit + Gson
    implementation libs.retrofit
    implementation libs.converter.gson

    // Image loading
    implementation libs.glide
    implementation libs.recyclerview
    
    // Camera and Image handling
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    
    // Location services
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    
    // Navigation component
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    
    // ViewModel and LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    
    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // UPI payment integration
    implementation 'com.google.android.gms:play-services-wallet:19.3.0'
    
    // Retrofit for real API integration
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Room database for local storage
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    
    // DataStore for preferences
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    
    // Biometric authentication
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Image processing
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
